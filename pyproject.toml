[project]
name = "ha-power-insight"
version = "2026.11.0"
description = "Home Assistant custom component for electrical power insights"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
# Engine tier: pure-Python, no Home Assistant harness.
engine = [
    "pytest>=8.0",
]
# Full suite: engine tier + the Home Assistant integration tier.
dev = [
    "pytest>=8.0",
    # Pinned together: pytest-homeassistant pins the exact Home Assistant it
    # ships with, and renovate.json bumps both in one pull request.
    "homeassistant==2026.11.0b6",
    "pytest-homeassistant==2026.11.0b6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
