[project]
name = "ha-power-insight"
version = "2026.11.4"
description = "Home Assistant custom component for electrical power insights"
requires-python = ">=3.15.2,<3.16"

[dependency-groups]
# Engine tier: pure-Python, no Home Assistant harness.
engine = [
    "pytest>=8.0",
]
# Full suite: engine tier + the Home Assistant integration tier.
dev = [
    "pytest>=8.0",
    # Pins the exact Home Assistant it ships with (betas included), so
    # homeassistant moves with it in uv.lock. See renovate.json.
    "pytest-homeassistant==2026.11.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
