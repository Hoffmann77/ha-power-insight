name: Worksheet

# Issues a certification worksheet from the reference cases and attaches it to the
# run, so a sheet can be printed from anywhere without a local checkout.
#
# Run it from Actions -> Worksheet -> Run workflow. The PDF appears under the
# run's Artifacts. Answers are entered locally afterwards:
#
#   uv run python tools/certify.py --sheet <id>
#
# Download the sheet's .json manifest alongside the PDF and drop it in
# `worksheets/` first — that is what certify.py reads to know which problems
# were issued, and in what order.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many problems to issue"
        required: false
        default: "6"
      case:
        description: "Restrict to one case id (e.g. captive-load). Blank = all."
        required: false
        default: ""
      all:
        description: "Issue every pending problem, ignoring count"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group engine

      - name: Generate worksheet
        id: gen
        env:
          COUNT: ${{ inputs.count }}
          CASE: ${{ inputs.case }}
          ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          sheet_id="$(date -u +%Y-%m-%d-%H%M)"
          args=(--id "$sheet_id" --pdf)
          if [ "$ALL" = "true" ]; then
            args+=(--all)
          else
            args+=(--count "$COUNT")
          fi
          if [ -n "$CASE" ]; then
            args+=(--case "$CASE")
          fi
          uv run python tools/worksheet.py "${args[@]}"
          echo "sheet_id=$sheet_id" >> "$GITHUB_OUTPUT"

      - name: Upload sheet
        uses: actions/upload-artifact@v4
        with:
          name: worksheet-${{ steps.gen.outputs.sheet_id }}
          # The manifest travels with the PDF: certify.py needs it to replay
          # the problems in the order they were printed.
          path: |
            worksheets/*.pdf
            worksheets/*.html
            worksheets/*.json
          retention-days: 90
