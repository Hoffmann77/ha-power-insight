name: Worksheet

# Issues certification worksheets from the reference cases and attaches them to
# the run, so a sheet can be printed from anywhere without a local checkout.
#
# One worksheet is one snapshot: the wiring and the readings on the front, one
# page per pending property after it, and a transcription page at the back. Run
# it from Actions -> Worksheet -> Run workflow. The PDFs appear under the run's
# Artifacts. Answers are entered locally afterwards:
#
#   uv run python tools/certify.py --sheet <case>-<state>
#
# Download the sheet's .json manifest alongside the PDF and drop it in
# `worksheets/` first — that is what certify.py reads to know which problems
# were issued, and in what order.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Restrict to one case id (e.g. group-captivity). Blank = all."
        required: false
        default: ""
      state:
        description: "Restrict to one snapshot id within that case. Blank = all."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group engine

      - name: Generate worksheets
        id: gen
        env:
          CASE: ${{ inputs.case }}
          STATE: ${{ inputs.state }}
        run: |
          set -euo pipefail
          args=(--pdf)
          if [ -n "$CASE" ]; then
            args+=(--case "$CASE")
          fi
          if [ -n "$STATE" ]; then
            args+=(--state "$STATE")
          fi
          uv run python tools/worksheet.py "${args[@]}"
          echo "stamp=$(date -u +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Upload sheets
        uses: actions/upload-artifact@v4
        with:
          # Only the run stamp varies: the sheets themselves are named after the
          # snapshot they cover, so the same snapshot issued twice is the same
          # file both times.
          name: worksheets-${{ steps.gen.outputs.stamp }}
          # The manifests travel with the PDFs: certify.py needs one to replay a
          # sheet's problems in the order they were printed.
          path: |
            worksheets/*.pdf
            worksheets/*.html
            worksheets/*.json
          retention-days: 90
