name: Tests

on:
  push:
  pull_request:

jobs:
  # Engine tier: pure-Python calculation engine, no Home Assistant harness.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group engine

      - name: Run engine tests
        run: uv run --group engine pytest tests/engine -q

      # The docs render the reference cases from generated JSON. The cases
      # themselves are the Python in tests/engine/reference/, so a derived
      # answer added there but never exported is a value CI holds the engine to
      # and the published spec does not show.
      - name: Check the published reference cases are up to date
        run: uv run --group engine python tools/export_cases.py --check

  # Integration tier: Home Assistant layer via pytest-homeassistant-custom-component.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run integration tests
        run: uv run pytest tests/integration -q
