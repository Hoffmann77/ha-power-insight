name: Tests

# Pull requests are tested through `pull_request`; testing their pushes too would
# run every job twice. `main` is tested after each merge, and any other branch
# can be tested from Actions -> Tests -> Run workflow.
#
# A change that only touches the docs site is not tested. The paths below keep
# what the tests read: the property catalog and published cases under
# docs/spec/, and the decision log that manual/test_decisions.py checks.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!website/**'
      - '!docs/**'
      - 'docs/spec/**'
      - 'docs/dev/engine-calculations.md'
  pull_request:
    paths:
      - '**'
      - '!website/**'
      - '!docs/**'
      - 'docs/spec/**'
      - 'docs/dev/engine-calculations.md'
  workflow_dispatch:

# A new push to a pull request makes its running tests obsolete, so cancel
# them. Runs on main are never cancelled: each merge keeps its own result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Engine tier: pure-Python calculation engine, no Home Assistant harness.
  # One job per suite, so the checks list names the suite that failed.
  # `docs` runs `reference/`: the showcase cases are well formed and the
  # published case JSON is current. `other` runs everything the rest ignore, so
  # a new directory under tests/engine is still run without editing this file.
  engine-tests:
    name: engine-tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # A normal run takes under a minute. A dependency that has no wheel for the
    # chosen Python compiles from source for over 20 minutes in every job, so
    # stop it early.
    timeout-minutes: 10
    strategy:
      # Let every suite finish: one failing must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - suite: manual
            paths: tests/engine/manual
          - suite: automatic
            paths: tests/engine/automatic
          - suite: frozen
            paths: tests/engine/frozen
          - suite: docs
            paths: tests/engine/reference
          - suite: other
            paths: >-
              tests/engine
              --ignore=tests/engine/manual
              --ignore=tests/engine/automatic
              --ignore=tests/engine/frozen
              --ignore=tests/engine/reference
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group engine

      - name: Run engine tests (${{ matrix.suite }})
        run: uv run --group engine pytest ${{ matrix.paths }} -q

      # A frozen-snapshot or stale-docs failure is a list of engine outputs this
      # change moved, not necessarily a bug. Put that list where a reviewer sees
      # it first.
      - name: Summarise moved engine outputs
        if: failure() && (matrix.suite == 'frozen' || matrix.suite == 'docs')
        run: uv run --group engine python tools/snapshot.py --check >> "$GITHUB_STEP_SUMMARY" || true

  # Integration tier: Home Assistant layer via pytest-homeassistant-custom-component.
  integration-tests:
    runs-on: ubuntu-latest
    # See engine-tests.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run integration tests
        run: uv run pytest tests/integration -q
