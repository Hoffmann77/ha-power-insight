name: Release ZIP

# Attach power_insight.zip to every published release, pre-releases included.
# hacs.json sets `zip_release`, so HACS and the Marketplace install from this
# asset instead of the repository archive, and GitHub counts its downloads.
#
# Run it by hand with a tag to attach the ZIP to a release published before
# this workflow existed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the ZIP for, e.g. 2026.11.0"
        required: true

permissions: {}

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The Marketplace refuses an integration without a version the loader
      # accepts, and expects the tag. Stamp the tag into the shipped manifest,
      # so the two can never disagree.
      - name: Set the manifest version to the tag
        working-directory: custom_components/power_insight
        run: |
          jq --arg version "$TAG" '.version = $version' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          jq -r .version manifest.json

      # The files sit at the root of the ZIP: it is extracted into
      # custom_components/power_insight/.
      - name: Build power_insight.zip
        working-directory: custom_components/power_insight
        run: |
          zip -r "$GITHUB_WORKSPACE/power_insight.zip" . -x '*__pycache__*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/power_insight.zip"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" power_insight.zip --repo "$REPO" --clobber
