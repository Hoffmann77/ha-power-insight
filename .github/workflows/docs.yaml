name: Docs

# Builds the Docusaurus site in `website/` and publishes it with the GitHub
# Pages "GitHub Actions" source — no gh-pages branch, no bot commits.
#
# NOTE: GitHub Pages must be set to Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions" (it was previously "Deploy from a branch",
# pointing at gh-pages, which `mike` managed).
on:
  # The published site carries released versions only, so a change to `docs/`
  # changes nothing a visitor sees until a release cuts it into a version. Only
  # the released versions (website/versioned_*, versions.json) and the site
  # machinery (theme, components, config) are worth a deploy.
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/docs.yaml'
  # Pull requests still build `docs/` too (under /next), so a broken link or a
  # bad MDX page fails the pull request rather than the release that cuts it.
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # `showLastUpdateTime` reads git history, so a shallow clone would
          # leave every page without a date.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Only the deploy leaves `docs/` out (see docusaurus.config.ts); every
      # other build includes it, so its links are checked.
      - name: Build
        run: npm run build
        env:
          DOCS_RELEASED_ONLY: ${{ github.ref == 'refs/heads/main' }}

      # GitHub Pages allows exactly one deployment per repository, so a pull
      # request cannot get its own URL without giving up the Actions publishing
      # source. Instead the built site is attached to the run: download it,
      # unpack it over `website/build`, and `npm run serve` renders it at the
      # real base path.
      - name: Upload reviewable build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-${{ github.event.number || github.sha }}
          path: website/build
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    # Only main publishes. Gated on the ref rather than "not a pull request",
    # so adding a branch to the push triggers above can never silently start
    # deploying it to the live site.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
